name: kirain
description: "Kirain - Asisten Keuanganmu. Personal finance app buat bantu bedain kebutuhan vs keinginan."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  supabase_flutter: ^2.17.1
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.7
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  quick_actions: ^1.1.0
  url_launcher: ^6.3.2
  home_widget: ^0.9.3
  uuid: ^4.5.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

# App icon config, consumed by `dart run flutter_launcher_icons` (dev-time
# code-gen, not a runtime dep). "Glass Depth" concept per CLAUDE.md's "App
# Icon — FINAL" — the source PNGs (here and under assets/splash/) are
# generated from the same alis-kaget mark used elsewhere in the app; see
# tool/generate_icon_assets.dart to regenerate them after any design tweak.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/adaptive_background.png
  adaptive_icon_foreground: assets/icon/adaptive_foreground.png
  # The foreground PNG already places the mark at 60-65% width itself (per
  # CLAUDE.md's spec) with generous safe-zone padding built in — default is
  # 16, which would shrink it a second time on top of that.
  adaptive_icon_foreground_inset: 0

# Native splash screen config, consumed by `dart run
# flutter_native_splash:create` (dev-time code-gen, not a runtime dep).
# Colors are the app's own `bg` token (AppTheme/KirainColors), not the old
# leftover Material teal — the splash should read as a seamless continuation
# into the app's real background, not a flash-cut from an unrelated color.
#
# `image`/`image_dark` (pre-Android-12) keep the wide "KIRAIN" wordmark —
# legacy splash just centers it at natural aspect ratio, no crop. The
# original asset is white-on-transparent (fine on the dark bg it was
# already used with) but would have been invisible on the new light bg, so
# `splash_logo_light.png` is the same wordmark recolored dark for that mode
# — same fill-vs-strong pairing everywhere else in the app.
# `android_12.image`/`image_dark` are DIFFERENT, square mark-only assets —
# Android 12+'s splash API forces content into a small icon-shaped safe
# zone like an adaptive icon, not a full-width banner, so feeding it the
# wide wordmark is what was clipping "KIRAIN" on the sides. These reuse the
# alis-kaget mark but with mint/coral (dark bg) or mintStrong/coralStrong
# (light bg) instead of the app icon's own dark+coral pair — that pair is
# tuned for the icon's mint gradient background and its left arc (#0D1412)
# would be invisible against a flat #0D1412 splash background.
flutter_native_splash:
  color: "#F6FAF7"
  image: assets/splash/splash_logo_light.png
  color_dark: "#0D1412"
  image_dark: assets/splash/splash_logo.png
  android_12:
    color: "#F6FAF7"
    image: assets/splash/splash_icon_light.png
    color_dark: "#0D1412"
    image_dark: assets/splash/splash_icon_dark.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  # Sora (display/heading) + Inter (body) per CLAUDE.md's "Tipografi —
  # FINAL", bundled as local assets rather than fetched at runtime via
  # google_fonts — this is an offline-first app, it shouldn't need a network
  # round-trip just to render its own text on first launch. Both are
  # variable fonts (single file spanning the whole weight axis); each weight
  # below points at the same file so Skia picks the right instance instead
  # of always rendering the default (Regular) weight regardless of the
  # requested FontWeight. License: SIL OFL 1.1, full text alongside the
  # font files in assets/fonts/.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 400
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 500
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 600
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 700
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
